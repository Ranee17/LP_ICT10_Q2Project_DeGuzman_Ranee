<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background: url("chips.bg.jpg") no-repeat center center fixed;
            background-size: cover;
        }

        

        .thething {
            width: 100%;
            padding: 20px;
            border: 3px solid white;
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            color: white;
            background-color: #ffffff5e;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        

        .rat {
            position: fixed;
            bottom: -100px;
            left: -50px;
            width: 400px;
            height: auto;
        }

        

        .dorito-bag {
            position: fixed;
            top: -200px;
            left: 1000px;
            width: 800px;
            height: auto;
        }

        

        .dorito-link {
            position: fixed;
            display: inline-block;
            
        }

        .dorito-link img {
            width: 100%;
            display: block;
        }

        .dorito-link span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 3px black;
        }

        

        .seatwork {
            top: 100px;
            left: 800px;
            width: 300px;
            
        }

        .skills {
            top: 250px;
            left: 500px;
            width: 250px;
            
        }

        .creator {
            top: 400px;
            left: 300px;
            width: 200px;
            
        }

    </style>
</head>

<body>

    

    <div class="thething">
        Homepage (click the chips)
    </div>

    

    <a href="seatwork 1 2nd qtr/index.html" class="dorito-link seatwork">
        <img src="dordado1.png" alt="Seatwork 1">
        <span>SEATWORK 1</span>
    </a>

    <a href="skillstest2nd/index.html" class="dorito-link skills">
        <img src="dordado2.png" alt="Skills Test">
        <span>SKILLS TEST</span>
    </a>

    <a href="Meetthecreator/index.html" class="dorito-link creator">
        <img src="dordado3.png" alt="Meet the Creator">
        <span>MEET THE CREATOR</span>
    </a>

    

    <img src="goodrat.png" class="rat" alt="Rat">

    <img src="doritosbag.png" class="dorito-bag" alt="Doritos bag">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
